pluginGroup = dev.red.apiscope
pluginName = ApiScope
pluginVersion = 0.3.1

# 目标平台：IntelliJ IDEA Community 2024.2（Ultimate 同样可装）
platformType = IC
platformVersion = 2024.2

# verifyPlugin 额外对着「本机真正在用的那个 IDE」校验一遍 ——
# 编译沙箱停在 2024.2，装插件的 IDE 往往新好几个大版本，两边行为并不等价
# （0.2.0 的页签标题不显示就只在新版本上出现）。换机器改这一行即可。
# 开源默认留空（避免硬编码本机路径）。注意：留空时 verifyPlugin 会因「No IDE resolved」
# 直接 FAILED（不是跳过）；本地校验时命令行临时传即可，不必改本文件：
#   ./gradlew verifyPlugin -PverifyAgainstLocalIde="/Applications/IntelliJ IDEA.app/Contents"
verifyAgainstLocalIde =

# 插件不打包自己的 kotlin-stdlib，由 IntelliJ 平台提供
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = false
